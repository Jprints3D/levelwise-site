<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Reset password — Levelwise</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <div class="bars" aria-hidden="true"><span class="c-micro"></span><span class="c-daily"></span><span class="c-weekly"></span><span class="c-project"></span><span class="c-life"></span></div>
  <h1>Reset your password</h1>
  <p id="status" class="muted">Checking your reset link…</p>
  <div id="choice" hidden>
    <p><a id="openApp" href="#" style="display:inline-block;padding:10px 18px;font-size:16px">Open in the Levelwise app</a></p>
    <p><button id="here" type="button" style="padding:10px 18px;font-size:16px">Reset on this page instead</button></p>
    <p class="muted">The link works once: use the app or this page, not both.</p>
  </div>
  <form id="form" hidden>
    <p><label>New password<br><input id="pw" type="password" minlength="8" autocomplete="new-password" required style="width:100%;padding:10px;font-size:16px"></label></p>
    <p><label>Confirm new password<br><input id="pw2" type="password" minlength="8" autocomplete="new-password" required style="width:100%;padding:10px;font-size:16px"></label></p>
    <p><button type="submit" style="padding:10px 18px;font-size:16px">Save new password</button></p>
  </form>
</main>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const sb = createClient('https://sjwlpdotpwetyflpeosa.supabase.co', 'sb_publishable_sNXlslc-TjkeMltgjE4pQw_Fnm6aZNr', { auth: { detectSessionInUrl: true, flowType: 'implicit' } });
const status = document.getElementById('status'), form = document.getElementById('form');
const hash = new URLSearchParams(location.hash.slice(1)), q = new URLSearchParams(location.search);
const choice = document.getElementById('choice');
async function start() {
  const err = hash.get('error_description') || q.get('error_description');
  if (err) { status.textContent = err + ' Request a new reset email from the app.'; return; }
  // On iPhone / iPad, offer to finish in the app (levelwise://reset-password?token_hash=…).
  const iOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const th = q.get('token_hash');
  if (iOS && th && /^[A-Za-z0-9_-]{6,512}$/.test(th)) {
    document.getElementById('openApp').href = 'levelwise://reset-password?token_hash=' + encodeURIComponent(th) + '&type=recovery';
    document.getElementById('here').addEventListener('click', () => { choice.hidden = true; status.textContent = 'Checking your reset link…'; ready(); });
    status.textContent = 'Choose where to set your new password.';
    choice.hidden = false;
    return;
  }
  ready();
}
async function ready() {
  if (q.get('token_hash')) {
    const { error } = await sb.auth.verifyOtp({ token_hash: q.get('token_hash'), type: q.get('type') || 'recovery' });
    history.replaceState(null, '', location.pathname);
    if (error) { status.textContent = error.message + ' Request a new reset email from the app.'; return; }
  } else if (q.get('code')) {
    // Reset requested in the app (PKCE): only that app can finish it.
    const c = q.get('code');
    const iOSc = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    if (iOSc && /^[A-Za-z0-9_-]{6,512}$/.test(c)) {
      document.getElementById('openApp').href = 'levelwise://reset-password?code=' + encodeURIComponent(c) + '&type=recovery';
      document.getElementById('here').hidden = true;
      status.textContent = 'You asked for this reset in the Levelwise app. Open it there to choose a new password.';
      choice.hidden = false;
      return;
    }
    status.textContent = 'You asked for this reset in the Levelwise app. Open this email on that iPhone and tap the link there, or request a new reset from the app.'; return;
  }
  const { data } = await sb.auth.getSession();
  if (!data.session) { status.textContent = 'This reset link is invalid or has expired. Request a new one from the Levelwise app.'; return; }
  status.textContent = 'Signed in as ' + (data.session.user.email || 'your account') + '. Choose a new password.';
  form.hidden = false;
}
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const pw = document.getElementById('pw').value, pw2 = document.getElementById('pw2').value;
  if (pw !== pw2) { status.textContent = 'The passwords do not match.'; return; }
  const { error } = await sb.auth.updateUser({ password: pw });
  if (error) { status.textContent = error.message; return; }
  form.hidden = true;
  status.textContent = 'Your password is updated. Go back to the Levelwise app and sign in with it.';
  await sb.auth.signOut();
});
setTimeout(start, 300);
</script>
</body>
</html>
