<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Reset password — Levelwise</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <div class="bars" aria-hidden="true"><span class="c-micro"></span><span class="c-daily"></span><span class="c-weekly"></span><span class="c-project"></span><span class="c-life"></span></div>
  <h1>Reset your password</h1>
  <p id="status" class="muted">Checking your reset link…</p>
  <form id="form" hidden>
    <p><label>New password<br><input id="pw" type="password" minlength="8" autocomplete="new-password" required style="width:100%;padding:10px;font-size:16px"></label></p>
    <p><label>Confirm new password<br><input id="pw2" type="password" minlength="8" autocomplete="new-password" required style="width:100%;padding:10px;font-size:16px"></label></p>
    <p><button type="submit" style="padding:10px 18px;font-size:16px">Save new password</button></p>
  </form>
</main>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const sb = createClient('https://sjwlpdotpwetyflpeosa.supabase.co', 'sb_publishable_sNXlslc-TjkeMltgjE4pQw_Fnm6aZNr', { auth: { detectSessionInUrl: true, flowType: 'implicit' } });
const status = document.getElementById('status'), form = document.getElementById('form');
const hash = new URLSearchParams(location.hash.slice(1)), q = new URLSearchParams(location.search);
async function ready() {
  const err = hash.get('error_description') || q.get('error_description');
  if (err) { status.textContent = err + ' Request a new reset email from the app.'; return; }
  if (q.get('code')) { const { error } = await sb.auth.exchangeCodeForSession(q.get('code')); if (error) { status.textContent = error.message; return; } }
  const { data } = await sb.auth.getSession();
  if (!data.session) { status.textContent = 'This reset link is invalid or has expired. Request a new one from the Levelwise app.'; return; }
  status.textContent = 'Signed in as ' + (data.session.user.email || 'your account') + '. Choose a new password.';
  form.hidden = false;
}
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const pw = document.getElementById('pw').value, pw2 = document.getElementById('pw2').value;
  if (pw !== pw2) { status.textContent = 'The passwords do not match.'; return; }
  const { error } = await sb.auth.updateUser({ password: pw });
  if (error) { status.textContent = error.message; return; }
  form.hidden = true;
  status.textContent = 'Your password is updated. Go back to the Levelwise app and sign in with it.';
  await sb.auth.signOut();
});
setTimeout(ready, 300);
</script>
</body>
</html>
